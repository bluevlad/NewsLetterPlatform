services:
  # 스케줄러 서비스 (데이터 수집 + 뉴스레터 발송)
  newsletterplatform-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsletterplatform-scheduler
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      # .env 는 .dockerignore 로 이미지에서 제외됨 — 볼륨으로만 공급 (비밀 이미지 베이크 금지)
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
      # 컨테이너 → 호스트 Ollama (TechBriefing analyzer/translator). localhost 금지.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - unmong-network
      - database-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 스케줄러 heartbeat(10분 주기) 기반 생존 판정 — 항상 성공하는 no-op 금지
      test: ["CMD", "python", "-c", "from src.common.scheduler.health import check_heartbeat; import sys; sys.exit(0 if check_heartbeat() else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 웹 서버 서비스 (구독 관리)
  newsletterplatform-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsletterplatform-web
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # 호스트 loopback 전용 바인딩 — 외부 직접 접근 차단 (SEC-04).
      # 게이트웨이(nginx)는 unmong-network 로 컨테이너에 직접 도달하므로 publish 불필요.
      # 직접 접근이 가능하면 X-Forwarded-For 위조로 rate limit 우회가 가능해진다.
      - "127.0.0.1:4050:4050"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      # .env 는 .dockerignore 로 이미지에서 제외됨 — 볼륨으로만 공급 (비밀 이미지 베이크 금지)
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
      # 컨테이너 → 호스트 Ollama (TechBriefing analyzer/translator). localhost 금지.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    command: ["python", "-m", "src.main", "--web"]
    networks:
      - unmong-network
      - database-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4050/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  unmong-network:
    name: unmong-main_unmong-network
    external: true
  # 공유 PostgreSQL(postgresql:5432) 접근 — SQLite→PG 마이그레이션
  database-network:
    external: true
